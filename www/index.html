<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0830">
<title>Long Way Out</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#0b0830;--navy:#150f48;--card:rgba(21,15,72,.78);--line:rgba(170,150,255,.2);--ink:#f4f1ff;--mut:#a9a2d9;--acc:#4fe3ff;--hot:#ff6fb1;--grad:linear-gradient(135deg,#27d9ff,#7a5cff 55%,#ff5fc8);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
.s{display:none;height:100%;max-width:480px;margin:0 auto;overflow-y:auto;padding:14px}
.s.on{display:block}
#ob{max-width:none;padding:20px 16px;background:linear-gradient(165deg,#27d9ff,#7a5cff 58%,#ff5fc8)}
.hero{max-width:420px;margin:0 auto;padding:30px 24px 24px;background:linear-gradient(180deg,#1d1460,#0d0936);border-radius:54px 78px 60px 84px/64px 56px 80px 62px;text-align:center;box-shadow:0 20px 50px rgba(20,8,80,.45)}
#g.on{display:flex;padding:0;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden;max-width:none}
#gc{touch-action:none;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:rgba(8,5,34,.78)}
h1,h2,p{margin:0}h1{font-weight:800;letter-spacing:-.02em}h2{font-weight:700;letter-spacing:-.01em}
p{margin:6px 0}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:28px 36px 28px 36px;padding:18px;margin:14px 0}
#ui{position:relative;z-index:1;transition:opacity .45s}
#ui h1,#ui #st,#ui #sd,#ui #nx{text-shadow:0 2px 10px rgba(8,5,40,.7)}
#hm.fs #ui{opacity:0;pointer-events:none}
#fh{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center;z-index:2;opacity:0;pointer-events:none;transition:opacity .45s;text-shadow:0 2px 10px rgba(8,5,40,.7)}
#hm.fs #fh{opacity:1;pointer-events:auto}
.b{width:100%;padding:14px;border:0;border-radius:999px;background:var(--grad);color:#fff;font:700 15px/1 inherit;font-family:inherit;margin-top:12px;box-shadow:0 8px 22px rgba(122,92,255,.4)}
.b:active{transform:scale(.98)}
.b.g{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
input,select{width:100%;padding:13px 16px;margin:6px 0;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:16px inherit;font-family:inherit}
select option{background:#150f48}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:6px 12px 6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:7px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grad)}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#27d9ff,#7a5cff,#ff5fc8)}
#tb{display:flex;gap:6px;margin-bottom:10px}
#tb button{flex:1;padding:9px 4px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font:600 13px inherit;font-family:inherit}
#tb button.on{background:var(--grad);color:#fff;border-color:transparent}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.row.me{color:var(--acc);font-weight:700}
#cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
#cg button,#cg i{border-radius:50%;font-size:13px;text-align:center;font-style:normal}
#cg i.w{color:var(--mut);font-size:12px}
#cg button{aspect-ratio:1;border:0;background:rgba(255,255,255,.06);color:var(--ink);padding:0;position:relative}
#cg button.pl{background:var(--grad);font-weight:700}
#cg button.td{box-shadow:0 0 0 2px var(--hot)}
#cg button.fu{color:#5a5496;background:transparent;border:1px dashed var(--line)}
.cn{display:flex;justify-content:space-between;align-items:center}
.cn button{width:38px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px}
</style></head><body>

<div class="s on" id="ob"><div class="hero">
 <h1 style="font-size:32px">Long Way Out</h1>
 <p class="mut">One mission a day. One journey from your home to the edge of everything.</p>
 <canvas id="gl" width="440" height="440" style="width:220px;height:220px;display:block;margin:8px auto"></canvas>
 <input id="un" maxlength="16" placeholder="Choose a username" autocomplete="off">
 <select id="cs"></select><select id="rs"></select>
 <button class="b" id="go">Begin the journey</button>
 <p class="mut" id="oe" style="color:var(--hot)"></p>
</div></div>

<div class="s" id="hm">
 <canvas id="sc" width="540" height="960" style="position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:100%;object-fit:cover;z-index:0"></canvas>
 <div id="ui">
 <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px">
  <div><div class="mut">Journey day</div><h1 id="dy" style="font-size:36px"></h1></div>
  <div style="text-align:right"><div id="st" style="font-weight:700;font-size:17px"></div><button class="b g" id="fsb" style="width:auto;padding:7px 12px;margin:6px 0 0;font-size:13px">Full view</button></div></div>
 <p class="mut" id="sd"></p>
 <div class="bar" style="margin-top:8px"><i id="pb"></i></div><p class="mut" id="nx"></p><div style="height:24vh"></div>
 <div class="chips" id="ch"></div>
 <div class="card"><div class="mut">Today’s mission</div><h2>Asteroid Dodge</h2><p class="mut" id="md"></p><button class="b" id="pl"></button><p class="mut" id="cd" style="text-align:center;margin-top:10px"></p></div>
 <div class="card"><div id="tb"></div><div id="lb"></div></div>
 <div class="card"><div class="cn"><button id="cp">‹</button><b id="cmn"></b><button id="cn">›</button></div><div id="cg"></div><p class="mut" id="cst"></p><p id="ci" style="min-height:22px"></p></div>
 <div class="card"><div class="mut">Prototype tools: jump to any stage</div><select id="jp"></select><button class="b g" id="dm">Fill sample history (demo)</button><p class="mut" id="rc" style="margin-top:8px"></p></div>
 </div>
 <div id="fh"><div id="ft"></div><button class="b g" id="fb">Back to missions</button></div>
</div>

<div class="s" id="g"><canvas id="gc" width="720" height="1280"></canvas><div id="ov"></div></div>

 x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(cx,cy,r*1.3,0,7);x.fill();

 if(bands){x.fillStyle='rgba(255,255,255,.17)';for(let i=0;i<4;i++){x.beginPath();x.ellipse(cx,cy-r*.52+i*r*.34,r*1.2,r*(.06+i*.012),-.25,0,7);x.fill()}}
 x.fillStyle='rgba(10,6,50,.24)';x.beginPath();x.arc(cx-r*.3,cy-r*.3,r*1.05,0,7);x.rect(cx-r,cy-r,2*r,2*r);x.fill('evenodd');x.restore()}

 .map(([k,a])=>{const o=[];for(let i=0;i<a.length;i+=2){const j=(i+2)%a.length,n=Math.max(1,Math.ceil(Math.hypot(a[j]-a[i],a[j+1]-a[i+1])/5));for(let q=0;q<n;q++)o.push([a[i]+(a[j]-a[i])*q/n,a[i+1]+(a[j+1]-a[i+1])*q/n])}return[k,o]});
const TERR=[['rgba(255,216,150,.8)',23,13,24,9],['rgba(255,216,150,.8)',24,45,10,9],['rgba(255,216,150,.8)',-25,134,13,8],['rgba(255,216,150,.8)',43,105,13,5],['rgba(10,140,110,.4)',-3,-62,20,10],['rgba(10,140,110,.4)',1,22,11,6],['rgba(10,140,110,.4)',60,100,26,6]];
function earth(x,cx,cy,R,la,lo,t,pin){

 for(let i=0;i<3;i++){x.fillStyle=i<g.hp?'#ff6fb1':'rgba(255,255,255,.18)';x.beginPath();x.arc(20+i*18,24,6,0,7);x.fill()}
 x.fillStyle='#fff';x.font='700 15px sans-serif';x.textAlign='right';x.fillText(Math.max(0,Math.ceil(40-g.t))+'s   '+(Math.round(g.t*10)+g.stars*50),348,29)}

/* ---------- result ---------- */
function finish(sc){
 const P=store.get(),d=UTC(),first=P.played[d]===undefined;
 if(first){P.played[d]=sc;P.days++;P.streak=P.last==UTC(-1)?P.streak+1:1;P.last=d;store.set(P)}
 showResult(sc,first)}
function showResult(sc,first){
 const P=store.get(),dd=day(),s=S[stg(dd)],sc0=first?sc:P.played[UTC()];
 let h=`<h2 style="margin-top:20px">Mission complete</h2><div style="font-size:56px;font-weight:800;letter-spacing:-2px">${sc}</div>`;
 if(!first)h+='<p class="mut">Practice run. Your first score of the day is the one that counts.</p>';
 h+='<div class="card">'+['World',P.cc,P.rg].map((t,k)=>{const b=board(k,sc0);return`<div class="row"><span>${t}</span><b>#${b.rank.toLocaleString()} <span class="mut">top ${Math.max(1,Math.round(100*b.rank/b.N))}%</span></b></div>`}).join('')+'</div>';
 h+=`<p>${P.streak}-day streak. Day ${dd}: ${s[1]}.</p><button class="b" id="sh">Share result</button><button class="b g" id="bk">Watch the zoom out</button>`;
 $('#rz').innerHTML=h;show('rz');
 const b2=board(2,sc0),txt=`Long Way Out, day ${dd}: ${s[1]}\nScore ${sc0}, #${b2.rank} in ${P.rg}`;
 $('#sh').onclick=async()=>{try{if(navigator.share)await navigator.share({text:txt});else{await navigator.clipboard.writeText(txt);$('#sh').textContent='Copied'}}catch(e){}};
 $('#bk').onclick=()=>{show('hm');refresh()}}

if(store.get()){show('hm');refresh()}else show('ob');
</script></body></html>
